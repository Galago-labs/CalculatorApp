# Workflow for building a Portable WPF Calculator

name: .NET Core Desktop (Portable Build)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Package Portable App
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x # Убедитесь, что ваш проект использует .NET 8

    - name: Restore Dependencies
      run: dotnet restore CalculatorApp/CalculatorApp.csproj

    - name: Publish Single File EXE
      # Galago-labs: Собираем портативную версию
      # -p:PublishSingleFile=true — всё упаковывается в один файл
      # --self-contained true — .NET Runtime будет внутри EXE
      run: |
        dotnet publish CalculatorApp/CalculatorApp.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:PublishReadyToRun=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -o ./publish

    - name: Upload Portable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Calculator-Portable-GalagoLabs-2026
        path: ./publish/*.exe
